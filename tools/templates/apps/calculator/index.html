<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quick math</title><link rel="stylesheet" href="styles/app.css"></head>
<body><main class="screen" id="app"><section class="display-panel"><p id="status" class="eyebrow">QUICK MATH</p><input id="display" readonly="readonly" value="0" aria-label="Result"></section><section class="keys"><button id="key-7" data-key="7" class="digit">7</button><button id="key-8" data-key="8" class="digit">8</button><button id="key-9" data-key="9" class="digit">9</button><button id="key-plus" data-key="+" class="op">+</button><button id="key-4" data-key="4" class="digit">4</button><button id="key-5" data-key="5" class="digit">5</button><button id="key-6" data-key="6" class="digit">6</button><button id="key-minus" data-key="-" class="op">-</button><button id="key-1" data-key="1" class="digit">1</button><button id="key-2" data-key="2" class="digit">2</button><button id="key-3" data-key="3" class="digit">3</button><button id="key-clear" data-key="C" class="op">C</button><button id="key-0" data-key="0" class="zero">0</button><button id="key-equals" data-key="=" class="equals">=</button></section></main><script src="scripts/app.js"></script></body></html>
