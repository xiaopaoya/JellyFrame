<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Wearable Launcher</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main class="launcher" aria-label="Wearable app launcher">
    <header class="top">
      <strong>09:41</strong>
      <span>MON 14</span>
    </header>
    <section class="app-grid" aria-label="Apps">
      <button class="tile weather" aria-label="Weather"><span class="icon"><i></i></span><span>Weather</span></button>
      <button class="tile activity" aria-label="Activity"><span class="icon"><i></i></span><span>Activity</span></button>
      <button class="tile focus" aria-label="Focus timer"><span class="icon"><i></i><b></b></span><span>Focus</span></button>
      <button class="tile music" aria-label="Music"><span class="icon"><i></i><b></b><em></em></span><span>Music</span></button>
      <button class="tile notes" aria-label="Notes"><span class="icon"><i></i><b></b><em></em></span><span>Notes</span></button>
      <button class="tile settings" aria-label="Settings"><span class="icon"><i></i><b></b><em></em><strong></strong></span><span>Settings</span></button>
    </section>
    <footer class="page-indicator" aria-label="Launcher page one of two"><span></span><i></i></footer>
  </main>
</body>
</html>
