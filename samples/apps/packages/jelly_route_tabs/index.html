<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Route Tabs</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main class="screen">
    <p class="eyebrow">APP-LOCAL ROUTE</p>
    <h1 id="title">Today</h1>
    <p id="summary" class="summary">Your next focus block starts at 09:30.</p>
    <section class="card"><p id="detail">Morning plan</p></section>
    <nav class="tabs" aria-label="Route tabs">
      <button data-route="today">Today</button>
      <button data-route="focus">Focus</button>
      <button data-route="settings">Prefs</button>
    </nav>
  </main>
  <script src="scripts/app.js"></script>
</body>
</html>
