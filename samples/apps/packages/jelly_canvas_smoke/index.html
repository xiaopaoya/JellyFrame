<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Jelly Canvas Smoke</title>
    <link rel="stylesheet" href="styles/app.css">
  </head>
  <body>
    <main class="screen">
      <section class="hero">
        <p class="eyebrow">Activity</p>
        <h1 id="score">6.4k</h1>
        <p class="label">steps today</p>
      </section>
      <canvas id="trend-source" width="110" height="48" class="canvas-source" aria-hidden="true"></canvas>
      <canvas id="trend" width="220" height="96" class="trend"></canvas>
      <section class="stats">
        <article>
          <strong>72</strong>
          <span>bpm</span>
        </article>
        <article>
          <strong>38</strong>
          <span>min</span>
        </article>
      </section>
    </main>
    <script src="scripts/app.js"></script>
  </body>
</html>
