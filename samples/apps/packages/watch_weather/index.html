<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Weather</title><link rel="stylesheet" href="styles/app.css"></head>
<body><main class="screen" id="app"><p class="eyebrow">SHANGHAI <span id="source">Sample</span></p>
<section class="weather"><div class="reading"><div class="temperature"><strong id="temp">26</strong><span id="unit">C</span></div><p id="condition">Cloudy</p></div><img id="icon" src="assets/cloudy.bmp" width="64" height="64" alt=""></section>
<p id="summary" class="summary">High 29 / Low 22</p>
<section class="facts"><p><span>Wind</span><strong id="wind">8 km/h</strong></p><p><span>Rain</span><strong id="rain">20%</strong></p></section>
<nav class="tabs"><button id="hourly" data-mode="hourly">Hour</button><button id="daily" data-mode="daily">Day</button><button id="air" data-mode="air">Air</button></nav></main><script src="scripts/app.js"></script></body></html>
