<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Component Recipes</title>
    <link rel="stylesheet" href="styles/app.css">
  </head>
  <body>
    <main class="screen">
      <header class="topbar">
        <div>
          <span class="eyebrow">Recipes</span>
          <strong>Daily UI</strong>
        </div>
        <span class="badge">OK</span>
      </header>

      <section class="content-scroll">
        <article class="hero-card">
          <span class="status-dot"></span>
          <div>
            <h1>Ready</h1>
            <p>Cards, buttons, scroll content and bottom nav in one shell.</p>
          </div>
        </article>

        <article class="recipe-card">
          <h2>Buttons</h2>
          <p>Use short labels and keep two actions per row on narrow screens.</p>
          <div class="button-row">
            <button class="button primary">OK</button>
            <button class="button">Set</button>
          </div>
        </article>

        <article class="recipe-card soft">
          <h2>Cards</h2>
          <p>Cards keep repeated data scan-friendly without nesting panels.</p>
          <div class="metric-row">
            <span>Focus</span>
            <strong>42m</strong>
          </div>
        </article>

        <article class="recipe-card">
          <h2>List</h2>
          <ul class="mini-list">
            <li><span>Steps</span><strong>6K</strong></li>
            <li><span>Water</span><strong>5/8</strong></li>
            <li><span>Sleep</span><strong>7h</strong></li>
          </ul>
        </article>
      </section>

      <nav class="bottom-nav" aria-label="Sections">
        <button class="nav-button is-active">Home</button>
        <button class="nav-button">Stats</button>
        <button class="nav-button">More</button>
      </nav>
    </main>
  </body>
</html>
