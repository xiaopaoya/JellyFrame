<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reading setup</title><link rel="stylesheet" href="styles/app.css"></head>
<body><main class="screen" id="app"><p class="eyebrow">READING SETUP</p><section class="settings-card"><label class="caption" for="goal">Session name</label><input id="goal" class="name" value="Evening read" maxlength="18"><section class="level"><label for="brightness">Light level</label><strong id="pct">64%</strong></section><input id="brightness" type="range" min="0" max="100" step="1" value="64"><section class="toggle-row"><input id="quiet" type="checkbox" checked="checked"><label for="quiet">Quiet mode</label></section></section><button id="save">Save setup</button><p id="toast">Adjust your reading space.</p></main><script src="scripts/app.js"></script></body></html>
