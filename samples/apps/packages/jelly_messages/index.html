<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Messages</title><link rel="stylesheet" href="styles/app.css"></head>
<body>
<main id="app" class="screen">
  <section id="list-page" class="page"><header class="topbar"><div><span class="eyebrow">INBOX</span><h1>Inbox</h1></div><span id="unread-count" class="count">2</span></header><p class="subtle">Swipe left to remove. Swipe down for reply.</p><section id="message-list" class="message-list"></section><section id="quick-reply" class="quick-reply hidden"><span class="reply-title">Quick reply</span><button data-reply="On my way">On my way</button><button data-reply="Thanks">Thanks</button><button data-reply="Call later">Call later</button></section></section>
  <section id="detail-page" class="page hidden"><header class="topbar"><button id="detail-back" class="text-button">Back</button><span class="page-title">Message</span><span></span></header><article class="detail-card"><span id="detail-from" class="detail-from">Maya</span><h2 id="detail-title">Coffee?</h2><p id="detail-body">Are you free after the walk?</p><span id="detail-time" class="detail-time">08:10</span></article><p id="reply-status" class="subtle">Reply from the message list by swiping down.</p></section>
</main>
<script src="scripts/app.js"></script>
</body>
</html>
