<text x="64" y="1568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#101820">用色原则：大部分区域保持暗色留白；单屏 1 个品牌焦点，按需增加 1–2 种数据色。</text>
<text x="64" y="1610" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#496373">高光集中在数字、进度和主要操作上；圆屏中心布局，手环单列浏览，触控状态使用按压反馈。</text>
<text x="64" y="1644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#496373">OLED 可选纯黑底；LCD、反射式屏幕按实机可读性选择深浅主题。息屏亮度与刷新由设备控制。</text>
<text x="64" y="1678" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#496373">其他嵌入式界面复用同一色阶与状态语义；浅色主题作为补充，不主导腕上示例。</text>
<text x="64" y="1750" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#496373">JellyFrame · Wearable Color System v2 · 设计示意，非实机截图</text>
