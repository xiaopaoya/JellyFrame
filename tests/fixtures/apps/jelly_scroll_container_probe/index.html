<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scroll Container Probe</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main class="screen">
    <header class="hero">
      <span>Weather</span>
      <strong>Hourly</strong>
    </header>
    <section id="forecast" class="forecast">
      <button>06:00 Clear 18C</button>
      <button>07:00 Clouds 19C</button>
      <button>08:00 Rain 20C</button>
      <button>09:00 Wind 22C</button>
      <button>10:00 Sun 24C</button>
      <button>11:00 UV high 25C</button>
      <button>12:00 Warm 26C</button>
      <button>13:00 Dry 27C</button>
    </section>
    <nav class="tabs">
      <button>Now</button>
      <button>Hours</button>
      <button>Air</button>
    </nav>
  </main>
</body>
</html>
