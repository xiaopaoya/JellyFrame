<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WS147 Touch Drag Latency</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main class="screen">
    <h1>Drag response</h1>
    <label class="range-label" for="latency-range">Position</label>
    <input id="latency-range" type="range" min="0" max="100" step="5" value="50">
    <label class="action"><input id="action-toggle" type="checkbox"> Mark action</label>
    <section id="scroll-area" class="scroll-area">
      <button>Scroll item 1</button>
      <button>Scroll item 2</button>
      <button>Scroll item 3</button>
      <button>Scroll item 4</button>
      <button>Scroll item 5</button>
      <button>Scroll item 6</button>
      <button>Scroll item 7</button>
      <button>Scroll item 8</button>
    </section>
  </main>
</body>
</html>
