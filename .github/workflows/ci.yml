name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure sanitizer build
        run: >
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=OFF
          -DJELLYFRAME_ENABLE_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build-sanitizers --parallel

      - name: Run sanitizer CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  windows:
    name: Windows build and smoke tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload external trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-trial-evidence-windows-release
          path: build/test_outputs/external_trial
          if-no-files-found: warn

      - name: Configure Debug
        shell: pwsh
        run: >
          cmake -S . -B build-debug
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=OFF

      - name: Build Debug
        shell: pwsh
        run: cmake --build build-debug --config Debug --parallel

      - name: Run Debug CTest
        shell: pwsh
        run: ctest --test-dir build-debug -C Debug --output-on-failure

      - name: Check Python tools
        shell: pwsh
        run: python -m py_compile tools\jellyframe_cli.py tools\package_app.py tools\app_registry.py tools\benchmark_guard.py

      - name: Check VS Code helper
        shell: pwsh
        run: |
          node --check tools\vscode-jellyframe\extension.js
          node -e "JSON.parse(require('fs').readFileSync('tools/vscode-jellyframe/package.json','utf8'))"

      - name: Run package diagnostics smoke tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ci | Out-Null
          python tools\jellyframe_cli.py check `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --report build\ci\watch_weather.check.report.json `
            --build-dir build\Release
          python tools\jellyframe_cli.py preview `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --output build\ci\watch_weather.ppm `
            --report build\ci\watch_weather.preview.report.json `
            --build-dir build\Release
          python tools\jellyframe_cli.py package `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --output-cpp build\ci\watch_weather_resources.cpp `
            --report build\ci\watch_weather.package.report.json `
            --build-dir build\Release
          python tools\jellyframe_cli.py install `
            --store build\ci\installed_apps `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --report build\ci\watch_weather.install.report.json `
            --build-dir build\Release
          build\Release\jellyframe_win32_browser.exe `
            --capture build\ci\app_manager.ppm `
            --registry-store build\ci\installed_apps `
            --viewport-width 390 `
            --viewport-height 640
          build\Release\jellyframe_win32_browser.exe `
            --capture build\ci\installed_launch.ppm `
            --registry-store build\ci\installed_apps `
            --launch-app org.jellyframe.examples.weather `
            --viewport-width 300 `
            --viewport-height 300
          build\Release\jellyframe_win32_browser.exe `
            --capture build\ci\app_manager_removed.ppm `
            --registry-store build\ci\installed_apps `
            --remove-app org.jellyframe.examples.weather `
            --viewport-width 390 `
            --viewport-height 640

      - name: Verify pipeline diagnostics report
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          report = json.loads(Path("build/ci/watch_weather.package.report.json").read_text(encoding="utf-8"))
          pipeline = report.get("pipelineDiagnostics", {})
          summary = pipeline.get("summary", {})
          assert pipeline.get("format") == "jellyframe.pipeline.diagnostics"
          assert int(summary.get("error", 0)) == 0
          print("pipelineDiagnostics", summary)
          '@ | python -

      - name: Run benchmark regression guard
        shell: pwsh
        run: >
          python tools\benchmark_guard.py
          --build-dir build\Release
          --suite all
          --report build\ci\benchmark_guard.report.json

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

  windows-scripting:
    name: Windows scripting bridge tests
    runs-on: windows-latest

    steps:
      - name: Checkout JellyFrame
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Build JerryScript
        shell: pwsh
        run: python third_party\jerryscript\tools\build.py --clean --cmake-param=-DJERRY_VM_HALT=ON

      - name: Configure scripting build
        shell: pwsh
        run: >
          cmake -S . -B build-scripting
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build scripting tests
        shell: pwsh
        run: cmake --build build-scripting --config Release --parallel

      - name: Run scripting CTest
        shell: pwsh
        run: ctest --test-dir build-scripting -C Release --output-on-failure

      - name: Configure scripting forms-off build
        shell: pwsh
        run: >
          cmake -S . -B build-scripting-forms-off
          -DJELLYFRAME_BUILD_EXAMPLES=OFF
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build scripting forms-off test target
        shell: pwsh
        run: cmake --build build-scripting-forms-off --config Release --target jellyframe_script_tests --parallel

      - name: Run scripting forms-off CTest
        shell: pwsh
        run: ctest --test-dir build-scripting-forms-off -C Release -R "^jellyframe_script_tests$" --output-on-failure
