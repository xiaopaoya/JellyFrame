name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_abi4_same_thread:
        description: Build and test the ordinary desktop/script path against merged Core ABI4
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux-sanitizers:
    name: Linux ASan and UBSan
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure sanitizer build
        run: >
          cmake -S . -B build/sanitizers-debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=OFF
          -DJELLYFRAME_ENABLE_SANITIZERS=ON

      - name: Build sanitizer targets
        run: cmake --build build/sanitizers-debug --parallel

      - name: Run sanitizer CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers-debug --output-on-failure

  windows:
    name: Windows build and smoke tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install released Render Core package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\released-render-core-source | Out-Null
          curl.exe --fail --location --retry 3 `
            --output build\jellyframe-render-core-0.8.0.tar.gz `
            https://github.com/xiaopaoya/JellyFrame-Render-Core/releases/download/v0.8.0/jellyframe-render-core-0.8.0.tar.gz
          $hash = (Get-FileHash build\jellyframe-render-core-0.8.0.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b650866d6fcf453e6b2cb54b3a685bbe9df1be07dd9d9825060651ec1e6c4240') { throw "Render Core archive SHA-256 mismatch: $hash" }
          tar -xzf build\jellyframe-render-core-0.8.0.tar.gz -C build\released-render-core-source
          cmake -S build\released-render-core-source\jellyframe-render-core-0.8.0 `
            -B build\released-render-core-build `
            -DJELLYFRAME_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Render Core configure failed' }
          cmake --build build\released-render-core-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Render Core build failed' }
          cmake --install build\released-render-core-build --config Release --prefix build\render-core-install-release
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Release install failed' }
          cmake --build build\released-render-core-build --config Debug --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Debug build failed' }
          cmake --install build\released-render-core-build --config Debug --prefix build\render-core-install-debug
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Debug install failed' }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-release
          -DJELLYFRAME_RENDER_CORE_PROVIDER=package
          -DJELLYFRAME_RENDER_CORE_PACKAGE_DIR=${{ github.workspace }}/build/render-core-install-release
          -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/desktop-release --config Release --parallel

      - name: Run CTest
        shell: pwsh
        run: ctest --test-dir build/desktop-release -C Release --output-on-failure

      - name: Upload external trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-trial-evidence-windows-release
          path: build/test_outputs/external_trial
          if-no-files-found: warn

      - name: Configure Debug
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-debug
          -DJELLYFRAME_RENDER_CORE_PROVIDER=package
          -DJELLYFRAME_RENDER_CORE_PACKAGE_DIR=${{ github.workspace }}/build/render-core-install-debug
          -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=OFF

      - name: Build Debug
        shell: pwsh
        run: cmake --build build/desktop-debug --config Debug --parallel

      - name: Run Debug CTest
        shell: pwsh
        run: ctest --test-dir build/desktop-debug -C Debug --output-on-failure

      - name: Check Python tools
        shell: pwsh
        run: python -m py_compile tools\jellyframe_cli.py tools\package_app.py tools\app_registry.py tools\render_performance_report.py tools\benchmark_compare.py project_tools\benchmark_guard.py

      - name: Check VS Code helper
        shell: pwsh
        run: |
          node --check tools\vscode-jellyframe\extension.js
          node --check tools\vscode-jellyframe\render_trace_viewer.js
          node --check tools\vscode-jellyframe\visual_editor.js
          node --check tools\vscode-jellyframe\visual_editor_webview.js
          node tests\tool_regression\vscode_build_profile_tests.js
          node tests\tool_regression\vscode_visual_editor_model_tests.js
          node tests\tool_regression\vscode_visual_editor_files_tests.js
          node tests\tool_regression\vscode_command_diagnostics_tests.js
          node tests\tool_regression\vscode_device_presentation_tests.js
          node tests\tool_regression\vscode_status_presentation_tests.js
          node tests\tool_regression\vscode_sdk_download_tests.js
          node tests\tool_regression\vscode_device_provider_download_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Provider download tests failed' }
          node tests\tool_regression\vscode_provider_ui_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Provider UI tests failed' }
          node tests\tool_regression\vscode_provider_connection_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Provider connection tests failed' }
          node tests\tool_regression\vscode_author_environment_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Author environment tests failed' }
          node tests\tool_regression\vscode_startup_feedback_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Startup feedback tests failed' }
          node tests\tool_regression\vscode_render_trace_viewer_tests.js
          node tests\tool_regression\vscode_performance_sessions_tests.js
          python tests\tool_regression\sdk_archive_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'SDK archive tests failed' }
          python tests\tool_regression\sdk_python_runtime_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'SDK Python acquisition tests failed' }
          python tests\tool_regression\author_startup_probe_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Author startup probe tests failed' }
          python tests\tool_regression\render_performance_report_tests.py
          python tests\tool_regression\benchmark_guard_tests.py
          python tests\tool_regression\benchmark_compare_tests.py
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('tools/vscode-jellyframe/package.json','utf8')); const s=fs.readFileSync('tools/vscode-jellyframe/extension.js','utf8'); if(!p.contributes?.viewsContainers?.activitybar?.some(v=>v.id==='jellyframe'&&v.icon==='media/jellyframe.svg')) throw new Error('JellyFrame Activity Bar container is missing'); if(!p.contributes?.views?.jellyframe?.some(v=>v.id==='jellyframe.status')) throw new Error('JellyFrame status view is missing'); if(p.contributes?.menus?.['menubar/main']) throw new Error('unsupported custom menubar contribution remains'); if(!fs.existsSync('tools/vscode-jellyframe/media/jellyframe.svg')) throw new Error('JellyFrame Activity Bar icon is missing'); if(!s.includes('function currentPackageRoot()') || !s.includes('onDidChangeActiveTextEditor')) throw new Error('JellyFrame status view does not follow the active package');"

      - name: Test visual editor browser interactions
        shell: pwsh
        run: |
          npm install --prefix build/visual-editor-browser --no-package-lock --ignore-scripts playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Playwright setup failed' }
          $env:NODE_PATH = Join-Path $PWD 'build/visual-editor-browser/node_modules'
          node tests/tool_regression/vscode_visual_editor_interaction_tests.js
          if ($LASTEXITCODE -ne 0) { throw 'Visual editor browser interactions failed' }
          node tests/tool_regression/vscode_visual_editor_alignment_conformance_tests.js build/desktop-release/Release/jellyframe_desktop_shell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Visual editor alignment conformance failed' }
          node tests/tool_regression/vscode_visual_editor_runtime_tests.js build/desktop-release/Release/jellyframe_desktop_shell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Visual editor Runtime fixtures failed' }

      - name: Upload visual editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-editor-browser-screenshots
          path: build/test_outputs/visual_editor
          if-no-files-found: warn

      - name: Run package diagnostics smoke tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ci | Out-Null
          python tools\jellyframe_cli.py check `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --report build\ci\watch_weather.check.report.json `
            --build-dir build\desktop-release\Release
          python tools\jellyframe_cli.py preview `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --output build\ci\watch_weather.ppm `
            --report build\ci\watch_weather.preview.report.json `
            --build-dir build\desktop-release\Release
          python tools\jellyframe_cli.py package `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --output-cpp build\ci\watch_weather_resources.cpp `
            --report build\ci\watch_weather.package.report.json `
            --build-dir build\desktop-release\Release
          python tools\jellyframe_cli.py install `
            --store build\ci\installed_apps `
            --root samples\apps\packages\watch_weather `
            --target round-300 `
            --report build\ci\watch_weather.install.report.json `
            --build-dir build\desktop-release\Release
          build\desktop-release\Release\jellyframe_desktop_shell.exe `
            --capture build\ci\app_manager.ppm `
            --registry-store build\ci\installed_apps `
            --viewport-width 390 `
            --viewport-height 640
          build\desktop-release\Release\jellyframe_desktop_shell.exe `
            --capture build\ci\installed_launch.ppm `
            --registry-store build\ci\installed_apps `
            --launch-app org.jellyframe.examples.weather `
            --viewport-width 300 `
            --viewport-height 300
          build\desktop-release\Release\jellyframe_desktop_shell.exe `
            --capture build\ci\app_manager_removed.ppm `
            --registry-store build\ci\installed_apps `
            --remove-app org.jellyframe.examples.weather `
            --viewport-width 390 `
            --viewport-height 640

      - name: Verify pipeline diagnostics report
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          report = json.loads(Path("build/ci/watch_weather.package.report.json").read_text(encoding="utf-8"))
          pipeline = report.get("pipelineDiagnostics", {})
          summary = pipeline.get("summary", {})
          assert pipeline.get("format") == "jellyframe.pipeline.diagnostics"
          assert int(summary.get("error", 0)) == 0
          print("pipelineDiagnostics", summary)
          '@ | python -

      - name: Run benchmark regression guard
        shell: pwsh
        run: >
          python project_tools\benchmark_guard.py
          --build-dir build\desktop-release\Release
          --suite all
          --report build\ci\benchmark_guard.report.json

      - name: Check whitespace
        shell: pwsh
        run: git diff --check

  windows-scripting:
    name: Windows scripting bridge tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout JellyFrame
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Patch and build JerryScript
        shell: pwsh
        run: |
          python tools/dependencies/patch_jerryscript.py --source-root third_party/jerryscript
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript WeakRef patch failed' }
          python third_party/jerryscript/tools/build.py --clean --cmake-param=-DJERRY_VM_HALT=ON
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript build failed' }

      - name: Install released Render Core package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\released-render-core-source | Out-Null
          curl.exe --fail --location --retry 3 `
            --output build\jellyframe-render-core-0.8.0.tar.gz `
            https://github.com/xiaopaoya/JellyFrame-Render-Core/releases/download/v0.8.0/jellyframe-render-core-0.8.0.tar.gz
          $hash = (Get-FileHash build\jellyframe-render-core-0.8.0.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b650866d6fcf453e6b2cb54b3a685bbe9df1be07dd9d9825060651ec1e6c4240') { throw "Render Core archive SHA-256 mismatch: $hash" }
          tar -xzf build\jellyframe-render-core-0.8.0.tar.gz -C build\released-render-core-source
          cmake -S build\released-render-core-source\jellyframe-render-core-0.8.0 `
            -B build\released-render-core-build `
            -DJELLYFRAME_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Render Core configure failed' }
          cmake --build build\released-render-core-build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Render Core build failed' }
          cmake --install build\released-render-core-build --config Release --prefix build\render-core-install-release
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Release install failed' }
          cmake --build build\released-render-core-build --config Debug --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Debug build failed' }
          cmake --install build\released-render-core-build --config Debug --prefix build\render-core-install-debug
          if ($LASTEXITCODE -ne 0) { throw 'Render Core Debug install failed' }

      - name: Configure scripting build
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-scripting-release
          -DJELLYFRAME_RENDER_CORE_PROVIDER=package
          -DJELLYFRAME_RENDER_CORE_PACKAGE_DIR=${{ github.workspace }}/build/render-core-install-release
          -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=ON
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJELLYFRAME_BUILD_SCRIPT_TASK_RUNTIME=ON
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build scripting tests
        shell: pwsh
        run: cmake --build build/desktop-scripting-release --config Release --parallel

      - name: Run scripting CTest
        shell: pwsh
        run: ctest --test-dir build/desktop-scripting-release -C Release --output-on-failure

      - name: Configure scripting forms-off build
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-scripting-forms-off
          -DJELLYFRAME_BUILD_EXAMPLES=OFF
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF
          -DJELLYFRAME_ENABLE_NODE_IDENTITY=ON
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build scripting forms-off test target
        shell: pwsh
        run: cmake --build build/desktop-scripting-forms-off --config Release --target jellyframe_script_tests --parallel

      - name: Run scripting forms-off CTest
        shell: pwsh
        run: ctest --test-dir build/desktop-scripting-forms-off -C Release -R "^jellyframe_script_tests$" --output-on-failure

  canonical-abi4-installed-consumers:
    name: Canonical ABI4 Installed Consumers (${{ matrix.profile }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            profile_id: render-core-default
          - profile: cropped
            profile_id: render-core-minimal-no-forms-advanced

    steps:
      - name: Checkout JellyFrame
        uses: actions/checkout@v5

      - name: Checkout Render Core source
        uses: actions/checkout@v5
        with:
          repository: xiaopaoya/JellyFrame-Render-Core
          ref: master
          path: third_party/render-core-source

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Patch and build JerryScript
        shell: pwsh
        run: |
          python tools/dependencies/patch_jerryscript.py --source-root third_party/jerryscript
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript WeakRef patch failed' }
          python third_party/jerryscript/tools/build.py --clean --cmake-param=-DJERRY_VM_HALT=ON
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript build failed' }

      - name: Configure and install ABI4 Render Core
        shell: pwsh
        run: |
          $core = 'third_party/render-core-source'
          $build = "build\core-abi4-${{ matrix.profile }}"
          $install = "build\core-install-${{ matrix.profile }}"
          $args = @(
            '-S', $core, '-B', $build,
            '-DJELLYFRAME_BUILD_TESTS=OFF',
            '-DJELLYFRAME_INSTALL_RENDER_CORE=ON',
            '-DJELLYFRAME_RENDER_CORE_ENGINE_ABI=4'
          )
          if ('${{ matrix.profile }}' -eq 'cropped') {
            $args += @(
              '-DJELLYFRAME_ENABLE_CANVAS2D=OFF',
              '-DJELLYFRAME_ENABLE_MODERN_PAINT=OFF',
              '-DJELLYFRAME_ENABLE_FLEX_GRID=OFF',
              '-DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF'
            )
          }
          cmake @args
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 build failed' }
          cmake --install $build --config Release --prefix $install
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 install failed' }
          $manifest = Get-Content "$build\generated\jellyframe_render_core_source_manifest.json" -Raw | ConvertFrom-Json
          $profile = Get-Content "$build\generated\jellyframe_render_core_profile.json" -Raw | ConvertFrom-Json
          if ($profile.engineAbi -ne 4 -or $profile.profileId -ne '${{ matrix.profile_id }}') {
            throw "Unexpected Core ABI/profile: $($profile.engineAbi)/$($profile.profileId)"
          }
          "EXPECTED_CORE_SOURCE_HASH=$($manifest.sourceHash)" >> $env:GITHUB_ENV
          "EXPECTED_CORE_PROFILE_ID=$($profile.profileId)" >> $env:GITHUB_ENV
          "CORE_INSTALL_PREFIX=$((Resolve-Path $install).Path)" >> $env:GITHUB_ENV

      - name: Configure installed v9 consumers
        shell: pwsh
        run: >-
          cmake -S docs/evaluation/canonical-abi4-codec-v9-consumer
          -B build/canonical-v9-consumers-${{ matrix.profile }}
          -DJellyFrameRenderCore_DIR="$env:CORE_INSTALL_PREFIX\lib\cmake\JellyFrameRenderCore"
          -DEXPECTED_CORE_SOURCE_HASH="$env:EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_CORE_PROFILE_ID="$env:EXPECTED_CORE_PROFILE_ID"
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build and run installed v9 consumers
        shell: pwsh
        run: |
          cmake --build build/canonical-v9-consumers-${{ matrix.profile }} --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Canonical ABI4 consumers failed to build' }
          ctest --test-dir build/canonical-v9-consumers-${{ matrix.profile }} -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Canonical ABI4 installed consumer tests failed' }

  r3-installed-event-owners:
    name: R3 Event and Owner Installed Consumers (${{ matrix.profile }}, Node ${{ matrix.node_identity }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            profile_id: render-core-default
            node_identity: 'OFF'
          - profile: cropped
            profile_id: render-core-minimal-no-forms-advanced
            node_identity: 'OFF'
          - profile: full
            profile_id: render-core-default
            node_identity: 'ON'
          - profile: cropped
            profile_id: render-core-minimal-no-forms-advanced
            node_identity: 'ON'

    steps:
      - name: Checkout JellyFrame
        uses: actions/checkout@v5

      - name: Checkout Render Core source
        uses: actions/checkout@v5
        with:
          repository: xiaopaoya/JellyFrame-Render-Core
          ref: f7aee11cfd6c58b89ecc4922a598a2fada97c48b
          path: third_party/render-core-source

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Patch and build JerryScript
        shell: pwsh
        run: |
          python tools/dependencies/patch_jerryscript.py --source-root third_party/jerryscript
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript WeakRef patch failed' }
          python third_party/jerryscript/tools/build.py --clean --cmake-param=-DJERRY_VM_HALT=ON
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript build failed' }

      - name: Configure and install ABI4 Render Core
        shell: pwsh
        run: |
          $core = 'third_party/render-core-source'
          $build = "build\core-abi4-${{ matrix.profile }}"
          $install = "build\core-install-${{ matrix.profile }}"
          $args = @(
            '-S', $core, '-B', $build,
            '-DJELLYFRAME_BUILD_TESTS=OFF',
            '-DJELLYFRAME_INSTALL_RENDER_CORE=ON',
            '-DJELLYFRAME_RENDER_CORE_ENGINE_ABI=4'
          )
          if ('${{ matrix.profile }}' -eq 'cropped') {
            $args += @(
              '-DJELLYFRAME_ENABLE_CANVAS2D=OFF',
              '-DJELLYFRAME_ENABLE_MODERN_PAINT=OFF',
              '-DJELLYFRAME_ENABLE_FLEX_GRID=OFF',
              '-DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF'
            )
          }
          cmake @args
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 build failed' }
          cmake --install $build --config Release --prefix $install
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI4 install failed' }
          $manifest = Get-Content "$build\generated\jellyframe_render_core_source_manifest.json" -Raw | ConvertFrom-Json
          $profile = Get-Content "$build\generated\jellyframe_render_core_profile.json" -Raw | ConvertFrom-Json
          if ($manifest.sourceHash -ne 'f7c17009b7660a84ef6a492367637187dff6915c4af3418c769902b3b7eb2559' -or
              $manifest.sourceFileCount -ne 145) {
            throw 'Pinned R3 Core source identity mismatch'
          }
          if ($profile.engineAbi -ne 4 -or $profile.profileId -ne '${{ matrix.profile_id }}') {
            throw "Unexpected Core ABI/profile: $($profile.engineAbi)/$($profile.profileId)"
          }
          "EXPECTED_CORE_SOURCE_HASH=$($manifest.sourceHash)" >> $env:GITHUB_ENV
          "EXPECTED_CORE_PROFILE_ID=$($profile.profileId)" >> $env:GITHUB_ENV
          "CORE_INSTALL_PREFIX=$((Resolve-Path $install).Path)" >> $env:GITHUB_ENV

      - name: Configure installed v9 consumers
        shell: pwsh
        run: >-
          cmake -S docs/evaluation/canonical-abi4-codec-v9-consumer
          -B build/r3-installed-consumers-${{ matrix.profile }}
          -DJellyFrameRenderCore_DIR="$env:CORE_INSTALL_PREFIX\lib\cmake\JellyFrameRenderCore"
          -DEXPECTED_CORE_SOURCE_HASH="$env:EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_CORE_PROFILE_ID="$env:EXPECTED_CORE_PROFILE_ID"
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=ON
          -DJELLYFRAME_ENABLE_NODE_IDENTITY=${{ matrix.node_identity }}
          '-DCMAKE_CXX_FLAGS=/GR- /EHsc'
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build and run installed v9 consumers
        shell: pwsh
        run: |
          cmake --build build/r3-installed-consumers-${{ matrix.profile }} --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Canonical ABI4 consumers failed to build' }
          ctest --test-dir build/r3-installed-consumers-${{ matrix.profile }} -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Canonical ABI4 installed consumer tests failed' }

  canonical-v10-installed-consumers:
    name: Canonical v10 Installed Consumer and Worker (${{ matrix.profile }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            profile_id: render-core-default
          - profile: cropped
            profile_id: render-core-minimal-no-forms-advanced
    env:
      CORE_F5_COMMIT: a0067eebde0ffe677e6e38acdd4c75da8bc78b50
      EXPECTED_CORE_SOURCE_HASH: 369973a9b051cdff8af56f5bd11a94cd17c75de6940473d2fa6dcee8b171c33c
      EXPECTED_CORE_SOURCE_FILE_COUNT: '139'
      EXPECTED_CORE_PROFILE_ID: ${{ matrix.profile_id }}

    steps:
      - name: Checkout JellyFrame Runtime
        uses: actions/checkout@v5

      - name: Checkout merged Core F5 PR 20
        uses: actions/checkout@v5
        with:
          repository: xiaopaoya/JellyFrame-Render-Core
          ref: a0067eebde0ffe677e6e38acdd4c75da8bc78b50
          path: third_party/render-core-f5

      - name: Verify exact merged Core revision
        shell: pwsh
        run: |
          $revision = (git -C third_party/render-core-f5 rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:CORE_F5_COMMIT) {
            throw "Expected merged Core F5 $env:CORE_F5_COMMIT, got $revision"
          }

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Patch and build JerryScript
        shell: pwsh
        run: |
          python tools/dependencies/patch_jerryscript.py --source-root third_party/jerryscript
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript WeakRef patch failed' }
          python third_party/jerryscript/tools/build.py --clean --cmake-param=-DJERRY_VM_HALT=ON
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript build failed' }

      - name: Build and install pinned Core F5 profile
        shell: pwsh
        run: |
          $build = 'build/core-f5-${{ matrix.profile }}'
          $install = 'build/core-f5-install-${{ matrix.profile }}'
          $coreArgs = @(
            '-S', 'third_party/render-core-f5', '-B', $build,
            '-DJELLYFRAME_BUILD_TESTS=OFF',
            '-DJELLYFRAME_INSTALL_RENDER_CORE=ON'
          )
          if ('${{ matrix.profile }}' -eq 'cropped') {
            $coreArgs += @(
              '-DJELLYFRAME_ENABLE_CANVAS2D=OFF',
              '-DJELLYFRAME_ENABLE_MODERN_PAINT=OFF',
              '-DJELLYFRAME_ENABLE_FLEX_GRID=OFF',
              '-DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF'
            )
          }
          cmake @coreArgs
          if ($LASTEXITCODE -ne 0) { throw 'Core F5 configure failed' }
          $manifest = Get-Content "$build/generated/jellyframe_render_core_source_manifest.json" -Raw | ConvertFrom-Json
          $profile = Get-Content "$build/generated/jellyframe_render_core_profile.json" -Raw | ConvertFrom-Json
          if ($manifest.sourceHash -ne $env:EXPECTED_CORE_SOURCE_HASH -or
              $manifest.sourceFileCount -ne [int]$env:EXPECTED_CORE_SOURCE_FILE_COUNT -or
              @($manifest.files).Count -ne [int]$env:EXPECTED_CORE_SOURCE_FILE_COUNT) {
            throw 'Core F5 source manifest does not match the merged source pin'
          }
          $packageVersion = [version]($profile.packageVersion -replace '-.*$', '')
          if ($packageVersion -lt [version]'0.9' -or $profile.engineAbi -ne 4 -or
              $profile.profileId -ne $env:EXPECTED_CORE_PROFILE_ID) {
            throw "Unexpected Core F5 package/ABI/profile: $($profile | ConvertTo-Json -Compress)"
          }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core F5 build failed' }
          cmake --install $build --config Release --prefix $install
          if ($LASTEXITCODE -ne 0) { throw 'Core F5 install failed' }
          "CORE_F5_INSTALL_PREFIX=$((Resolve-Path $install).Path)" >> $env:GITHUB_ENV

      - name: Configure installed v10 consumer and actual worker
        shell: pwsh
        run: >-
          cmake -S docs/evaluation/canonical-abi4-codec-v10
          -B build/canonical-v10-consumers-${{ matrix.profile }}
          -DJellyFrameRenderCore_DIR="$env:CORE_F5_INSTALL_PREFIX/lib/cmake/JellyFrameRenderCore"
          -DEXPECTED_CORE_SOURCE_HASH="$env:EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_CORE_PROFILE_ID="$env:EXPECTED_CORE_PROFILE_ID"
          -DBUILD_V10_WORKER=ON
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE/third_party/jerryscript"

      - name: Build and run installed v10 consumer and actual worker
        shell: pwsh
        run: |
          $build = 'build/canonical-v10-consumers-${{ matrix.profile }}'
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Canonical v10 consumers failed to build' }
          ctest --test-dir $build -C Release -V --output-on-failure --timeout 90
          if ($LASTEXITCODE -ne 0) { throw 'Canonical v10 installed consumer/worker tests failed' }

      - name: Configure legacy Event API checks on pinned Core F5
        shell: pwsh
        run: >-
          cmake -S docs/evaluation/canonical-abi4-codec-v9-consumer
          -B build/f5-legacy-event-api-${{ matrix.profile }}
          -DJellyFrameRenderCore_DIR="$env:CORE_F5_INSTALL_PREFIX/lib/cmake/JellyFrameRenderCore"
          -DEXPECTED_CORE_SOURCE_HASH="$env:EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_CORE_PROFILE_ID="$env:EXPECTED_CORE_PROFILE_ID"
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE/third_party/jerryscript"

      - name: Build and run legacy Event API checks on pinned Core F5
        shell: pwsh
        run: |
          $build = 'build/f5-legacy-event-api-${{ matrix.profile }}'
          cmake --build $build --config Release --target runtime_canonical_v9_script_api_consumer --parallel
          if ($LASTEXITCODE -ne 0) { throw 'F5 legacy Event API consumer failed to build' }
          ctest --test-dir $build -C Release -R '^installed_runtime_canonical_v9_script_api$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'F5 legacy Event API consumer failed' }

      - name: Upload canonical v10 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v10-installed-${{ matrix.profile }}
          path: |
            build/canonical-v10-consumers-${{ matrix.profile }}/qualified_core_identity.txt
            build/canonical-v10-consumers-${{ matrix.profile }}/Testing/Temporary/LastTest.log
            build/f5-legacy-event-api-${{ matrix.profile }}/qualified_core_identity.txt
            build/f5-legacy-event-api-${{ matrix.profile }}/Testing/Temporary/LastTest.log
            build/core-f5-${{ matrix.profile }}/generated/jellyframe_render_core_source_manifest.json
            build/core-f5-${{ matrix.profile }}/generated/jellyframe_render_core_profile.json
          if-no-files-found: warn

  render-core-standalone:
    name: Standalone Render Core
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The export rehearsal compares retained path history. The synthetic
          # pull-request merge commit is not part of that history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install history-export tool
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Configure Render Core only
        run: >
          cmake -S . -B build/render-core-standalone -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJELLYFRAME_BUILD_APP_RUNTIME=OFF
          -DJELLYFRAME_BUILD_DEVICE_RUNTIME_CONTRACTS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=OFF
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SAMPLE_REGRESSION_TESTS=OFF
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_INSTALL_RENDER_CORE=ON

      - name: Build Render Core tests
        run: cmake --build build/render-core-standalone --parallel

      - name: Run standalone CTest
        run: ctest --test-dir build/render-core-standalone --output-on-failure

      - name: Create Render Core source distribution
        run: >
          python project_tools/package_render_core_source.py
          --output-dir build/render-core-source-dist

      - name: Verify standalone Render Core source archive
        run: >
          python tests/tool_regression/render_core_source_archive_tests.py
          --cmake cmake
          --source-root .
          --generator Ninja

      - name: Rehearse history-preserving Render Core export
        run: >
          python tests/tool_regression/render_core_history_export_tests.py
          --cmake cmake
          --source-root .
          --generator Ninja

      - name: Archive Render Core source distribution
        uses: actions/upload-artifact@v4
        with:
          name: jellyframe-render-core-source
          path: build/render-core-source-dist/
          if-no-files-found: error

      - name: Download released Render Core source package
        run: |
          curl --fail --location --retry 3 \
            --output build/jellyframe-render-core-0.8.0.tar.gz \
            https://github.com/xiaopaoya/JellyFrame-Render-Core/releases/download/v0.8.0/jellyframe-render-core-0.8.0.tar.gz
          echo "b650866d6fcf453e6b2cb54b3a685bbe9df1be07dd9d9825060651ec1e6c4240  build/jellyframe-render-core-0.8.0.tar.gz" | sha256sum --check --status
          mkdir -p build/released-render-core-source
          tar -xzf build/jellyframe-render-core-0.8.0.tar.gz -C build/released-render-core-source

      - name: Install released Render Core package
        run: |
          cmake -S build/released-render-core-source/jellyframe-render-core-0.8.0 \
            -B build/released-render-core-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DJELLYFRAME_BUILD_TESTS=OFF
          cmake --build build/released-render-core-build --parallel
          cmake --install build/released-render-core-build --prefix build/render-core-install

      - name: Configure Runtime against installed Render Core
        run: >
          cmake -S . -B build/framework-external-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJELLYFRAME_RENDER_CORE_PROVIDER=package
          -DJELLYFRAME_RENDER_CORE_PACKAGE_DIR=${{ github.workspace }}/build/render-core-install
          -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=OFF
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SAMPLE_REGRESSION_TESTS=OFF
          -DJELLYFRAME_BUILD_TESTS=ON

      - name: Build Runtime package consumer tests
        run: >
          cmake --build build/framework-external-core
          --target jellyframe_app_runtime_tests jellyframe_device_runtime_contracts_tests
          --parallel

      - name: Run Runtime package consumer CTest
        run: ctest --test-dir build/framework-external-core --output-on-failure

  windows-abi4-same-thread:
    name: Windows ordinary app path on Core ABI3 and ABI4
    if: github.event_name != 'workflow_dispatch' || inputs.run_abi4_same_thread
    runs-on: windows-latest

    steps:
      - name: Checkout JellyFrame Runtime
        uses: actions/checkout@v5

      - name: Build locked Render Core 0.8.0 ABI3 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\abi3-core-source | Out-Null
          curl.exe --fail --location --retry 3 `
            --output build\jellyframe-render-core-0.8.0.tar.gz `
            https://github.com/xiaopaoya/JellyFrame-Render-Core/releases/download/v0.8.0/jellyframe-render-core-0.8.0.tar.gz
          $hash = (Get-FileHash build\jellyframe-render-core-0.8.0.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'b650866d6fcf453e6b2cb54b3a685bbe9df1be07dd9d9825060651ec1e6c4240') {
            throw "Render Core ABI3 archive SHA-256 mismatch: $hash"
          }
          tar -xzf build\jellyframe-render-core-0.8.0.tar.gz -C build\abi3-core-source
          cmake -S build\abi3-core-source\jellyframe-render-core-0.8.0 `
            -B build\abi3-core -DJELLYFRAME_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI3 configure failed' }
          cmake --build build\abi3-core --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI3 build failed' }
          cmake --install build\abi3-core --config Release --prefix build\abi3-core-install
          if ($LASTEXITCODE -ne 0) { throw 'Core ABI3 install failed' }

      - name: Configure and build locked ABI3 desktop shell
        shell: pwsh
        run: |
          cmake -S . -B build\abi3-default `
            -DJELLYFRAME_RENDER_CORE_PROVIDER=package `
            -DJELLYFRAME_RENDER_CORE_PACKAGE_DIR=${{ github.workspace }}\build\abi3-core-install `
            -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF `
            -DJELLYFRAME_BUILD_EXAMPLES=ON `
            -DJELLYFRAME_BUILD_TESTS=OFF `
            -DJELLYFRAME_BUILD_BENCHMARKS=OFF `
            -DJELLYFRAME_BUILD_SCRIPTING=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Runtime ABI3 configure failed' }
          $profile = Get-Content build\abi3-default\generated\jellyframe_render_core_profile.json -Raw | ConvertFrom-Json
          $provenance = Get-Content build\abi3-default\generated\jellyframe_render_core_provenance.json -Raw | ConvertFrom-Json
          if ($profile.engineAbi -ne 3 -or $profile.packageVersion -ne '0.8.0' -or
              $provenance.lockEnforced -ne $true -or
              $provenance.sourceHash -ne 'fa5914ce1559da5b12522fa28775287a535543d1be64da19a985e3d3f84cd795') {
            throw "Unexpected locked ABI3 provenance: $($provenance | ConvertTo-Json -Compress)"
          }
          cmake --build build\abi3-default --config Release --target jellyframe_desktop_shell --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Runtime ABI3 desktop shell failed to build' }

      - name: Checkout merged Render Core PR #17
        uses: actions/checkout@v5
        with:
          repository: xiaopaoya/JellyFrame-Render-Core
          ref: 431789fd78fc7f9a654f2f4a13d5e28be8f6e32f
          path: third_party/render-core-source

      - name: Verify merged Core source identity
        shell: pwsh
        run: |
          $coreRevision = (git -C third_party\render-core-source rev-parse HEAD).Trim()
          if ($coreRevision -ne '431789fd78fc7f9a654f2f4a13d5e28be8f6e32f') {
            throw "Expected merged Core PR #17 at 431789fd78fc7f9a654f2f4a13d5e28be8f6e32f, got $coreRevision"
          }
          $coreAbi4 = Select-String -Path third_party\render-core-source\cmake\render_core_version.cmake `
            -Pattern 'set\(JELLYFRAME_RENDER_CORE_ENGINE_ABI "4"' -Quiet
          if (-not $coreAbi4) { throw 'Checked-out Core source does not declare ABI4' }

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Patch and build JerryScript
        shell: pwsh
        run: |
          python tools/dependencies/patch_jerryscript.py --source-root third_party/jerryscript
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript WeakRef patch failed' }
          python third_party/jerryscript/tools/build.py --clean --cmake-param=-DJERRY_VM_HALT=ON
          if ($LASTEXITCODE -ne 0) { throw 'JerryScript build failed' }

      - name: Configure ordinary desktop and scripting consumers
        shell: pwsh
        run: >-
          cmake -S . -B build/abi4-same-thread
          -DJELLYFRAME_RENDER_CORE_PROVIDER=in-tree
          -DJELLYFRAME_RENDER_CORE_SOURCE_DIR=${{ github.workspace }}/third_party/render-core-source
          -DJELLYFRAME_BUILD_RENDER_CORE_TESTS=OFF
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJELLYFRAME_ENABLE_R3_SCRIPT_EVENTS=OFF
          -DJELLYFRAME_BUILD_SCRIPT_TASK_RUNTIME=OFF
          -DJERRYSCRIPT_ROOT=${{ github.workspace }}/third_party/jerryscript

      - name: Verify ABI4 source-override provenance
        shell: pwsh
        run: |
          $profile = Get-Content build\abi4-same-thread\generated\jellyframe_render_core_profile.json -Raw | ConvertFrom-Json
          $provenance = Get-Content build\abi4-same-thread\generated\jellyframe_render_core_provenance.json -Raw | ConvertFrom-Json
          if ($profile.engineAbi -ne 4 -or $profile.packageVersion -ne '0.9.0-dev') {
            throw "Unexpected Core profile: ABI $($profile.engineAbi), version $($profile.packageVersion)"
          }
          if ($provenance.provider -ne 'source-override' -or $provenance.engineAbi -ne 4 -or
              $provenance.lockEnforced -ne $false -or
              $provenance.sourceHash -ne '488874f1f2ce0880a47da5695cbe88a13a14b927461360cff3b58f8e9d2e6172' -or
              $provenance.sourceFileCount -ne 138 -or
              $provenance.lockedVersion -ne '0.8.0' -or $provenance.lockedEngineAbi -ne 3 -or
              $provenance.lockedSourceHash -ne 'fa5914ce1559da5b12522fa28775287a535543d1be64da19a985e3d3f84cd795') {
            throw "Unexpected Core source-override provenance: $($provenance | ConvertTo-Json -Compress)"
          }

      - name: Build desktop shell and same-thread scripting tests
        shell: pwsh
        run: >-
          cmake --build build/abi4-same-thread --config Release
          --target jellyframe_desktop_shell jellyframe_script_tests jellyframe_app_runtime_tests
          --parallel

      - name: Run ordinary script and App Runtime unit tests
        shell: pwsh
        run: >-
          ctest --test-dir build/abi4-same-thread -C Release
          -R "^(jellyframe_script_tests|jellyframe_app_runtime_tests)$"
          --output-on-failure
      - name: Exercise ordinary ABI4 desktop app entry
        shell: pwsh
        run: >-
          python tests\tool_regression\runtime_abi4_same_thread_tests.py
          build\abi4-same-thread\Release\jellyframe_desktop_shell.exe
