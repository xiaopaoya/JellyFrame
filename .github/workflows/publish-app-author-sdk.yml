name: Publish App Author SDK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable commit SHA or signed tag to package"
        required: true
        type: string
      tag:
        description: "New GitHub release tag, for example app-sdk-v0.6.0-dev"
        required: true
        type: string
      prerelease:
        description: "Mark the SDK release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish verified App Author SDK
    runs-on: windows-latest

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Checkout JerryScript
        uses: actions/checkout@v5
        with:
          repository: jerryscript-project/jerryscript
          ref: b7069350c2e52e7dc721dfb75f067147bd79b39b
          path: third_party/jerryscript

      - name: Build JerryScript
        shell: pwsh
        run: python third_party\jerryscript\tools\build.py --clean --cmake-param=-DJERRY_VM_HALT=ON

      - name: Configure standard desktop Release
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-release
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=OFF
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=OFF

      - name: Build standard desktop Release
        shell: pwsh
        run: cmake --build build/desktop-release --config Release --parallel

      - name: Configure scripting desktop Release
        shell: pwsh
        run: >
          cmake -S . -B build/desktop-scripting-release
          -DJELLYFRAME_BUILD_EXAMPLES=ON
          -DJELLYFRAME_BUILD_TESTS=OFF
          -DJELLYFRAME_BUILD_BENCHMARKS=OFF
          -DJELLYFRAME_BUILD_SCRIPTING=ON
          -DJELLYFRAME_BUILD_SCRIPT_TASK_RUNTIME=ON
          -DJERRYSCRIPT_ROOT="$env:GITHUB_WORKSPACE\third_party\jerryscript"

      - name: Build scripting desktop Release
        shell: pwsh
        run: cmake --build build/desktop-scripting-release --config Release --parallel

      - name: Package and verify SDK
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $asset = "jellyframe-app-sdk-$version.zip"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$visualStudio\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Missing redistributable x64 MSVC runtime' }
          python project_tools\package_app_author_sdk.py `
            --build-dir build\desktop-release\Release `
            --scripting-build-dir build\desktop-scripting-release\Release `
            --embedded-python-cache build\sdk-python-cache `
            --msvc-runtime-dir $crt.FullName `
            --output "build\$asset"
          if ($LASTEXITCODE -ne 0) { throw 'SDK packaging failed' }
          python tests\tool_regression\app_author_sdk_tests.py build\desktop-release\Release
          if ($LASTEXITCODE -ne 0) { throw 'SDK regression tests failed' }
          python tests\tool_regression\sdk_embedded_python_tests.py "build\$asset"
          if ($LASTEXITCODE -ne 0) { throw 'Isolated SDK Python smoke failed' }
          $hash = (Get-FileHash "build\$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -NoNewline -Encoding ascii "build\$asset.sha256"
          "ASSET=build\$asset" >> $env:GITHUB_ENV
          "SIDECAR=build\$asset.sha256" >> $env:GITHUB_ENV

      - name: Package matching VS Code extension
        shell: pwsh
        run: |
          & tools\vscode-jellyframe\manage-extension.ps1 -Action Package
          if ($LASTEXITCODE -ne 0) { throw 'VSIX packaging failed' }
          $version = (Get-Content tools\vscode-jellyframe\package.json -Raw | ConvertFrom-Json).version
          $vsix = "tools/vscode-jellyframe/jellyframe-tools-$version.vsix"
          $hash = (Get-FileHash $vsix -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  jellyframe-tools-$version.vsix" | Set-Content -NoNewline -Encoding ascii "$vsix.sha256"
          "VSIX=$vsix" >> $env:GITHUB_ENV
          "VSIX_SIDECAR=$vsix.sha256" >> $env:GITHUB_ENV

      - name: Publish GitHub SDK release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag already exists: ${{ inputs.tag }}"
          }
          $arguments = @(
            'release', 'create', '${{ inputs.tag }}', $env:ASSET, $env:SIDECAR, $env:VSIX, $env:VSIX_SIDECAR,
            '--repo', '${{ github.repository }}',
            '--target', '${{ inputs.ref }}',
            '--title', 'JellyFrame App Author SDK ${{ inputs.tag }}',
            '--notes', 'Versioned JellyFrame App Author SDK built from ${{ inputs.ref }}. The VS Code extension verifies the uploaded SHA-256 digest before installation.'
          )
          if ('${{ inputs.prerelease }}' -eq 'true') {
            $arguments += '--prerelease'
          }
          gh @arguments
